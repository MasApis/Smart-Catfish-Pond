<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achmad | Smart Pond</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        .card-glow { transition: all 0.3s ease; }
        .bg-ideal { background-color: rgba(34, 197, 94, 0.2); border-color: #22c55e; }
        .bg-warning { background-color: rgba(234, 179, 8, 0.2); border-color: #eab308; }
        .bg-danger { background-color: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="container mx-auto p-4 md:p-8 max-w-5xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-400 mb-2">Monitoring Kolam Lele Pak Achmad</h1>
            <div class="flex items-center justify-center gap-2 mb-1">
                <span id="connection-dot" class="text-red-500 text-xl">●</span> 
                <span id="connection-text" class="text-sm font-bold tracking-widest uppercase text-red-500">Offline</span>
            </div>
            <p id="last-update" class="text-[10px] text-gray-500 italic mb-4"></p>
            <p class="text-gray-400 italic text-sm">Monitoring Realtime by AnaknyaSendiri</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div id="card-temp" class="bg-gray-800 p-6 rounded-3xl border-2 border-gray-700 shadow-xl card-glow text-center">
                <p class="text-xs uppercase font-semibold text-gray-400">Suhu Air</p>
                <h2 id="temp" class="text-5xl md:text-6xl font-bold my-4">--°C</h2>
                <div id="status-temp" class="text-sm font-medium px-3 py-1 rounded-lg inline-block">Memuat...</div>
                <p id="adv-temp" class="text-xs text-gray-400 mt-4 leading-relaxed"></p>
            </div>
            <div id="card-ph" class="bg-gray-800 p-6 rounded-3xl border-2 border-gray-700 shadow-xl card-glow text-center">
                <p class="text-xs uppercase font-semibold text-gray-400">Kadar pH</p>
                <h2 id="ph" class="text-5xl md:text-6xl font-bold my-4">--</h2>
                <div id="status-ph" class="text-sm font-medium px-3 py-1 rounded-lg inline-block">Memuat...</div>
                <p id="adv-ph" class="text-xs text-gray-500 mt-4 leading-relaxed"></p>
            </div>
            <div id="card-turb" class="bg-gray-800 p-6 rounded-3xl border-2 border-gray-700 shadow-xl card-glow text-center">
                <p class="text-xs uppercase font-semibold text-gray-400">Kekeruhan</p>
                <h2 id="turb" class="text-5xl md:text-6xl font-bold my-4">--%</h2>
                <div id="status-turb" class="text-sm font-medium px-3 py-1 rounded-lg inline-block">Memuat...</div>
                <p id="adv-turb" class="text-xs text-gray-400 mt-4 leading-relaxed"></p>
            </div>
        </div>

    </div>

    <script>
        // --- 1. KONFIGURASI TELEGRAM ---
        const TELE_TOKEN = "8639936281:AAEoX810rCWGfo7fhg4VpFKzg9x_6CakhSU";
        const TELE_CHAT_ID = "6199004691";

        // Variabel Memori (State Tracking)
        // true = Ideal, false = Bermasalah
        let lastStates = { temp: true, ph: true, turb: true }; 
        let sistemPernahBahaya = false; // Flag untuk trigger pesan "Semua Ideal"

        function kirimTele(pesan) {
            const url = `https://api.telegram.org/bot${TELE_TOKEN}/sendMessage?chat_id=${TELE_CHAT_ID}&text=${encodeURIComponent(pesan)}`;
            fetch(url)
                .then(res => console.log("Telegram terkirim!"))
                .catch(err => console.error("Gagal kirim Tele:", err));
        }

        // --- 2. KONFIGURASI FIREBASE ---
        const firebaseConfig = { databaseURL: "https://smart-pond-lele-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 3. MONITORING REAL-TIME (KARTU) ---
        db.ref('pond').on('value', (snap) => {
            const data = snap.val();
            if (!data) return;

            const isOnline = (Date.now() - (data.last_seen || 0)) < 180000;
            const colorClass = isOnline ? 'text-green-500' : 'text-red-500';
            
            document.getElementById('connection-dot').className = `${colorClass} text-xl`;
            const textElem = document.getElementById('connection-text');
            textElem.innerText = isOnline ? 'SYSTEM ONLINE' : 'SYSTEM OFFLINE';
            textElem.className = `text-sm font-bold tracking-widest uppercase ${colorClass}`;
            document.getElementById('last-update').innerText = "Last Sync: " + new Date(data.last_seen).toLocaleString();

            document.getElementById('temp').innerText = (data.temp || 0).toFixed(1) + "°C";
            document.getElementById('ph').innerText = (data.ph || 0).toFixed(1);
            document.getElementById('turb').innerText = Math.round(data.turbidity || 0) + "%";

            processAlerts(data);
        });

        // --- 4. LOGIKA ALARM CERDAS ---
        function processAlerts(d) {
            // Tentukan kondisi saat ini
            const currentStates = {
                temp: (d.temp >= 25 && d.temp <= 30),
                ph: (d.ph >= 6.5 && d.ph <= 8.0),
                turb: (d.turbidity < 70)
            };

            let rincianMasalah = "";
            let adaMasalahSekarang = false;
            let pesanUpdateStatus = "";

            // --- A. CEK SUHU ---
            if(!currentStates.temp) {
                adaMasalahSekarang = true;
                const ket = d.temp > 30 ? "PANAS" : "DINGIN";
                rincianMasalah += `- Suhu: ${d.temp.toFixed(1)}°C (${ket})\n`;
                updateUI('temp', ket, "danger", `Peringatan : suhu kolam ${ket.toLowerCase()}.`);
            } else {
                updateUI('temp', "IDEAL", "ideal", "Kondisi air sangat baik.");
            }

            // --- B. CEK PH ---
            if(!currentStates.ph) {
                adaMasalahSekarang = true;
                const ket = d.ph < 6.5 ? "ASAM" : "BASA";
                rincianMasalah += `- pH: ${d.ph.toFixed(1)} (${ket})\n`;
                updateUI('ph', ket, "danger", `Peringatan : kadar pH ${ket.toLowerCase()}.`);
            } else {
                updateUI('ph', "NORMAL", "ideal", "Kadar pH stabil.");
            }

            // --- C. CEK KEKERUHAN ---
            if(!currentStates.turb) {
                adaMasalahSekarang = true;
                rincianMasalah += `- Air Kotor (${Math.round(d.turbidity)}%)\n`;
                updateUI('turb', "KOTOR", "danger", "Peringatan : air kolam kotor.");
            } else {
                updateUI('turb', "JERNIH", "ideal", "Air bersih.");
            }

            // --- D. LOGIKA TELEGRAM (DETEKSI PERUBAHAN) ---
            const opsiWaktu = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            const waktuSkrg = new Date().toLocaleString('id-ID', opsiWaktu) + " WIB";

            // Cek apakah ada perubahan status dibanding data sebelumnya
            if (currentStates.temp !== lastStates.temp) {
                pesanUpdateStatus += currentStates.temp ? "✅ Suhu sudah kembali STABIL\n" : "⚠️ Suhu terdeteksi BERMASALAH\n";
            }
            if (currentStates.ph !== lastStates.ph) {
                pesanUpdateStatus += currentStates.ph ? "✅ kadar pH sudah kembali STABIL\n" : "⚠️ kadar pH terdeteksi BERMASALAH\n";
            }
            if (currentStates.turb !== lastStates.turb) {
                pesanUpdateStatus += currentStates.turb ? "✅ Air sudah kembali JERNIH\n" : "⚠️ Air terdeteksi KOTOR\n";
            }

            // JIKA ADA PERUBAHAN STATUS, KIRIM TELEGRAM
            if (pesanUpdateStatus !== "") {
                if (adaMasalahSekarang) {
                    // Skenario: Baru sakit, atau baru sembuh sebagian
                    const judul = !sistemPernahBahaya ? "⚠️ [PERINGATAN PAK ACHMAD] ⚠️" : "📢 [UPDATE KONDISI KOLAM]";
                    const pesan = `${judul}\n--------------------------\nWaktu: ${waktuSkrg}\n\nPROGRES:\n${pesanUpdateStatus}\nMASALAH TERSISA:\n${rincianMasalah}\nMohon kondisikan kolam Pak Achmad!`;
                    
                    kirimTele(pesan);
                    sistemPernahBahaya = true;
                } else {
                    // Skenario: Semua sudah sembuh (Kondisi Ideal)
                    const pesanIdeal = `✅ [INFO PAK ACHMAD] KONDISI KOLAM SUDAH IDEAL\n--------------------------\nWaktu: ${waktuSkrg}\n\nSEMUA MASALAH TERATASI:\n${pesanUpdateStatus}\nDATA TERAKHIR:\n- Suhu: ${d.temp.toFixed(1)}°C\n- pH: ${d.ph.toFixed(1)}\n- Kekeruhan: ${Math.round(d.turbidity)}%\n\nTerima kasih atas penanganannya!`;
                    
                    kirimTele(pesanIdeal);
                    sistemPernahBahaya = false;
                }
                
                // Update memori status terakhir
                lastStates = { ...currentStates };
            }
        }

        function updateUI(id, status, colorClass, adv) {
            document.getElementById('card-'+id).className = `bg-gray-800 p-6 rounded-3xl border-2 shadow-xl card-glow text-center bg-${colorClass}`;
            const s = document.getElementById('status-'+id);
            if(s) {
                s.innerText = status;
                s.className = `text-xs font-bold px-3 py-1 rounded-full text-white ${colorClass==='ideal'?'bg-green-500':(colorClass==='warning'?'bg-yellow-500':'bg-red-500')}`;
            }
            const a = document.getElementById('adv-'+id);
            if(a) a.innerText = adv;
        }
    </script>
</body>
</html>
