<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>masapistech | Smart Pond</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        .card-glow { transition: all 0.3s ease; }
        .bg-ideal { background-color: rgba(34, 197, 94, 0.2); border-color: #22c55e; }
        .bg-warning { background-color: rgba(234, 179, 8, 0.2); border-color: #eab308; }
        .bg-danger { background-color: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="container mx-auto p-4 md:p-8 max-w-5xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-400 mb-2">Smart Catfish Pond Pak Achmad</h1>
            <div class="flex items-center justify-center gap-2 mb-1">
                <span id="connection-dot" class="text-red-500 text-xl">●</span> 
                <span id="connection-text" class="text-sm font-bold tracking-widest uppercase text-red-500">Offline</span>
            </div>
            <p id="last-update" class="text-[10px] text-gray-500 italic mb-4"></p>
            <p class="text-gray-400 italic text-sm">Monitoring Realtime by masapistech</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div id="card-temp" class="bg-gray-800 p-6 rounded-3xl border-2 border-gray-700 shadow-xl card-glow text-center">
                <p class="text-xs uppercase font-semibold text-gray-400">Suhu Air</p>
                <h2 id="temp" class="text-5xl md:text-6xl font-bold my-4">--°C</h2>
                <div id="status-temp" class="text-sm font-medium px-3 py-1 rounded-lg inline-block">Memuat...</div>
                <p id="adv-temp" class="text-xs text-gray-400 mt-4 leading-relaxed"></p>
            </div>
            <div id="card-ph" class="bg-gray-800 p-6 rounded-3xl border-2 border-gray-700 shadow-xl card-glow text-center">
                <p class="text-xs uppercase font-semibold text-gray-400">Kadar pH</p>
                <h2 id="ph" class="text-5xl md:text-6xl font-bold my-4">--</h2>
                <div id="status-ph" class="text-sm font-medium px-3 py-1 rounded-lg inline-block">Memuat...</div>
                <p id="adv-ph" class="text-xs text-gray-500 mt-4 leading-relaxed"></p>
            </div>
            <div id="card-turb" class="bg-gray-800 p-6 rounded-3xl border-2 border-gray-700 shadow-xl card-glow text-center">
                <p class="text-xs uppercase font-semibold text-gray-400">Kekeruhan</p>
                <h2 id="turb" class="text-5xl md:text-6xl font-bold my-4">--%</h2>
                <div id="status-turb" class="text-sm font-medium px-3 py-1 rounded-lg inline-block">Memuat...</div>
                <p id="adv-turb" class="text-xs text-gray-400 mt-4 leading-relaxed"></p>
            </div>
        </div>

        <div class="mt-8 bg-gray-800 rounded-3xl p-6 shadow-xl border border-gray-700">
            <h3 class="text-lg font-bold mb-4 text-blue-300 uppercase tracking-widest text-sm">Log Aktivitas Kolam</h3>
            <div id="log-container" class="space-y-2 max-h-64 overflow-y-auto text-xs font-mono custom-scrollbar"></div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI TELEGRAM ---
        const TELE_TOKEN = "8639936281:AAEoX810rCWGfo7fhg4VpFKzg9x_6CakhSU";
        const TELE_CHAT_ID = "6199004691";

        // Flag Anti-Spam (Biar gak dikirim terus tiap 5 detik)
        let sudahLaporBahaya = false; 

        function kirimTele(pesan) {
            const url = `https://api.telegram.org/bot${TELE_TOKEN}/sendMessage?chat_id=${TELE_CHAT_ID}&text=${encodeURIComponent(pesan)}`;
            
            fetch(url)
                .then(res => console.log("Telegram terkirim!"))
                .catch(err => console.error("Gagal kirim Tele:", err));
        }

        // Konfigurasi Firebase (Sesuaikan URL kamu)
        const firebaseConfig = { databaseURL: "https://smart-pond-lele-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Real-time Cards & Online Status
        db.ref('pond').on('value', (snap) => {
            const data = snap.val();
            if (!data) return;

            // Online Status (Toleransi 3 Menit)
            const isOnline = (Date.now() - (data.last_seen || 0)) < 180000;
            document.getElementById('connection-dot').className = isOnline ? 'text-green-500 text-xl' : 'text-red-500 text-xl';
            document.getElementById('connection-text').innerText = isOnline ? 'SYSTEM ONLINE' : 'SYSTEM OFFLINE';
            document.getElementById('connection-text').className = `text-sm font-bold tracking-widest uppercase ${isOnline ? 'text-green-500' : 'text-red-500'}`;
            document.getElementById('last-update').innerText = "Last Sync: " + new Date(data.last_seen).toLocaleString();

            // Update Kartu
            document.getElementById('temp').innerText = (data.temp || 0).toFixed(1) + "°C";
            document.getElementById('ph').innerText = (data.ph || 0).toFixed(1);
            document.getElementById('turb').innerText = Math.round(data.turbidity || 0) + "%";

            processAlerts(data);
        });

        // 2. New History Listener (Hanya untuk Log)
        db.ref('history').limitToLast(1).on('child_added', (snap) => {
            const d = snap.val();
            
            // FORMAT TANGGAL DETAIL: Senin, 05 April 2026 - 13:45:00
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const detailWaktu = new Date(d.last_seen).toLocaleString('id-ID', options);
            
            // --- LOGIKA ALARM LOG ---
            // Suhu (25-30)
            if(d.temp > 30) {
                addLog(detailWaktu, `Peringatan : suhu kolam panas (${d.temp.toFixed(1)}°C)`, 'danger');
            } else if(d.temp < 25) {
                addLog(detailWaktu, `Peringatan : suhu kolam dingin (${d.temp.toFixed(1)}°C)`, 'danger');
            }

            // pH (6.5-8.0)
            if(d.ph < 6.5) {
                addLog(detailWaktu, `Peringatan : kadar pH terlalu asam (${d.ph.toFixed(1)})`, 'danger');
            } else if(d.ph > 8.0) {
                addLog(detailWaktu, `Peringatan : kadar pH terlalu basa (${d.ph.toFixed(1)})`, 'danger');
            }

            // Kekeruhan (>70)
            if(d.turbidity >= 70) {
                addLog(detailWaktu, `Peringatan : air kolam kotor parah (${Math.round(d.turbidity)}%)`, 'danger');
            }
        });

        function processAlerts(d) {
            let statusBahaya = false;
            let pesanLaporan = "⚠️ [ALARM MASAPITECH] ⚠️\n\n";

            // 1. Cek Suhu (25-30)
            if(d.temp < 25 || d.temp > 30) {
                statusBahaya = true;
                const ket = d.temp > 30 ? "TERLALU PANAS" : "TERLALU DINGIN";
                pesanLaporan += `Suhu: ${d.temp.toFixed(1)}°C (${ket})\n`;
                updateUI('temp', ket.split(' ')[1], "danger", `Peringatan : suhu kolam ${ket.toLowerCase()}.`);
            } else {
                updateUI('temp', "IDEAL", "ideal", "Kondisi air sangat baik.");
            }

            // 2. Cek pH (6.5-8.0)
            if(d.ph < 6.5 || d.ph > 8.0) {
                statusBahaya = true;
                const ket = d.ph < 6.5 ? "ASAM" : "BASA";
                pesanLaporan += `pH: ${d.ph.toFixed(1)} (${ket})\n`;
                updateUI('ph', ket, "danger", `Peringatan : kadar pH ${ket.toLowerCase()}.`);
            } else {
                updateUI('ph', "NORMAL", "ideal", "Kadar asam-basa stabil.");
            }

            // 3. Cek Kekeruhan (>70)
            if(d.turbidity >= 70) {
                statusBahaya = true;
                pesanLaporan += `Kekeruhan: ${Math.round(d.turbidity)}% (KOTOR)\n`;
                updateUI('turb', "KOTOR", "danger", "Peringatan : air kolam kotor.");
            } else {
                updateUI('turb', "JERNIH", "ideal", "Air bersih dan sehat.");
            }

            // --- LOGIKA PENGIRIMAN TELEGRAM ---
            if(statusBahaya && !sudahLaporBahaya) {
                kirimTele(pesanLaporan + "\nSegera cek kondisi kolam Pak Achmad!");
                sudahLaporBahaya = true; // Kunci biar gak spam
            } 
            
            // Reset kunci kalau semua sudah kembali IDEAL
            if(!statusBahaya) {
                if(sudahLaporBahaya) {
                    kirimTele("✅ [INFO] Kondisi kolam sudah kembali IDEAL.");
                }
                sudahLaporBahaya = false;
            }
        }

        function updateUI(id, status, colorClass, adv) {
            document.getElementById('card-'+id).className = `bg-gray-800 p-6 rounded-3xl border-2 shadow-xl card-glow text-center bg-${colorClass}`;
            const s = document.getElementById('status-'+id);
            s.innerText = status;
            s.className = `text-xs font-bold px-3 py-1 rounded-full text-white ${colorClass==='ideal'?'bg-green-500':(colorClass==='warning'?'bg-yellow-500':'bg-red-500')}`;
            document.getElementById('adv-'+id).innerText = adv;
        }

        function addLog(waktu, msg, type) {
            const container = document.getElementById('log-container');
            
            // Cek agar tidak ada pesan kembar yang masuk berurutan (Anti-Spam)
            if (container.firstChild && container.firstChild.innerText.includes(msg)) return;

            const color = type === 'danger' ? 'text-red-400 font-bold' : 'text-yellow-400 italic';
            
            // Tampilan: [Senin, 05 April 2026 - 13:45:00] Pesan Peringatan
            const formatLog = `<p class="${color}">[${waktu}] ${msg}</p>`;
            
            container.insertAdjacentHTML('afterbegin', formatLog);
        }
    </script>
</body>
</html>
